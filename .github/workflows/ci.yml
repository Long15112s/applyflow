name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/applyflow_build
      AUTH_SECRET: build-only-placeholder-secret-that-is-not-used-in-production
      AUTH_GITHUB_ID: build-placeholder
      AUTH_GITHUB_SECRET: build-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
