services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: applyflow
      POSTGRES_USER: applyflow
      POSTGRES_PASSWORD: applyflow
    ports:
      - "5432:5432"
    volumes:
      - applyflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyflow -d applyflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  applyflow_postgres:
